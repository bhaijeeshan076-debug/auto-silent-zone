name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["project.zip"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          unzip -q project.zip -d proj
          cd proj
          gradle assembleDebug --stacktrace
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk AutoSilentZone.apk
          gh release create "v${{ github.run_number }}" Auto
