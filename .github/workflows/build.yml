name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          unzip -q project.zip -d proj
          cd proj
          gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk AutoSilentZone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSilentZone-apk
          path: AutoSilentZone.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: AutoSilentZone.apk
